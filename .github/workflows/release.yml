name: Release

# Pushing a tag such as v1.0.0 builds the APK signed with the release key and
# publishes it as a GitHub Release. The download page links to
# releases/latest/download/domino-venezolano.apk, so the newest release is
# always what people get.
#
# Requires the signing secrets (tool/release/crear_clave_android.ps1). Without
# them the job stops instead of publishing a debug-signed APK, which could
# never be updated by later releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de la clave de firma. Ejecuta tool/release/crear_clave_android.ps1 (ver store/PUBLICACION.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # The tag sets the visible version (v1.0.2 -> 1.0.2); run_number keeps
      # the versionCode growing so each release installs over the last one.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk domino-venezolano.apk
          sha256sum domino-venezolano.apk > domino-venezolano.apk.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            domino-venezolano.apk domino-venezolano.apk.sha256 \
            --title "Domino Venezolano ${GITHUB_REF_NAME#v}" \
            --generate-notes
