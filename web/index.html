<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href` (the Pages
    workflow serves the app from /domino-venezolano/app/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Domino Venezolano: la libreta digital del dominó criollo.">
  <meta name="theme-color" content="#000000">

  <!-- Installable from Safari with "Añadir a pantalla de inicio" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dominó">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Domino Venezolano</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shown while the app downloads; Flutter draws over it once ready. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      color: #ffcc00; font: 600 16px system-ui, -apple-system, sans-serif;
    }
    #splash img { width: 112px; height: 112px; border-radius: 24px; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <span>Cargando la libreta…</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
